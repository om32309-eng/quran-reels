<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>صانع ريلز القرآن</title>
<link href="https://fonts.googleapis.com/css2?family=Amiri+Quran&family=Readex+Pro:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0d1b1e;--card:#15292d;--ink:#eef3ee;--mut:#9fb3b0;--gold:#d9b66a;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Readex Pro',system-ui,sans-serif;padding:16px;max-width:520px;margin-inline:auto}
h1{font-size:20px;margin:4px 0 14px;font-weight:600}
.panel{background:var(--card);border-radius:14px;padding:14px;display:grid;gap:10px}
label{font-size:13px;color:var(--mut);display:grid;gap:4px}
select,input{background:#0d1b1e;color:var(--ink);border:1px solid #2a4348;border-radius:10px;padding:10px;font:inherit;width:100%}
.row,.btns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
button,a.dl{border:0;border-radius:10px;padding:12px;font:inherit;font-weight:600;cursor:pointer;text-align:center;text-decoration:none}
#prev{background:#2a4348;color:var(--ink)}
#rec{background:var(--gold);color:#1b1608}
#stop{display:none;grid-column:1/-1;background:#7a2e2e;color:#fff}
#vidLbl{display:none}
button:disabled{opacity:.5;cursor:default}
footer{text-align:center;font-size:13px;color:var(--mut);margin:22px 0 6px}
footer b{color:var(--gold);font-weight:600;direction:ltr;unicode-bidi:isolate}
a.dl{display:none;background:#e9efe9;color:#0d1b1e;margin-top:10px}
#st{font-size:13px;color:var(--mut);min-height:20px;margin:10px 2px}
canvas{width:100%;max-width:360px;aspect-ratio:9/16;display:block;margin:12px auto 0;border-radius:14px;background:#000}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
</style>
</head>
<body>
<h1>صانع ريلز القرآن</h1>
<div class="panel">
  <label>السورة<select id="sura"></select></label>
  <div class="row">
    <label>من آية<input id="from" type="number" min="1" value="1"></label>
    <label>إلى آية<input id="to" type="number" min="1" value="3"></label>
  </div>
  <label>القارئ
    <select id="reciter">
      <option value="ar.alafasy">مشاري راشد العفاسي</option>
      <option value="ar.husary">محمود خليل الحصري</option>
      <option value="ar.minshawi">محمد صديق المنشاوي</option>
    </select>
  </label>
  <label>الخلفية
    <select id="theme">
      <option value="0">غروب على البحر</option>
      <option value="1">ليلة نجوم وقمر</option>
      <option value="2">غابة وضباب</option>
      <option value="3">جبال وشروق</option>
      <option value="v">فيديو طبيعة من جهازي</option>
    </select>
  </label>
  <label id="vidLbl">اختار ملف فيديو<input id="vid" type="file" accept="video/*"></label>
  <div class="btns">
    <button id="prev" type="button">معاينة</button>
    <button id="rec" type="button">تسجيل الفيديو</button>
    <button id="stop" type="button">إيقاف</button>
  </div>
</div>
<div id="st" role="status" aria-live="polite">جارٍ تحميل قائمة السور…</div>
<canvas id="cv" width="720" height="1280"></canvas>
<a class="dl" id="dl">تحميل الفيديو</a>
<footer>تصميم وتطوير: <b>Omar Mahmoud</b> © 2026</footer>

<script>
const API = 'https://api.alquran.cloud/v1';
const $ = id => document.getElementById(id);
const cv = $('cv'), ctx = cv.getContext('2d'), W = 720, H = 1280;
let suras = [], state = null, running = false, cancelled = false, objUrl = null, bgVid = null;
let actx, dest, audio, plain, directUsed = false;
const sleep = ms => new Promise(r => setTimeout(r, ms));
const status = t => $('st').textContent = t;
const strip = s => s.replace(/[\u064B-\u065F\u0670\u06D6-\u06ED]/g, '');

// ---------- القوائم ----------
async function getJSON(url) {
  const r = await fetch(url);
  const j = await r.json();
  if (!r.ok || j.code !== 200) throw new Error('api: ' + (j.data || j.status || r.status));
  return j.data;
}
async function init() {
  try {
    suras = await getJSON(API + '/surah');
    $('sura').innerHTML = suras.map(s => `<option value="${s.number}">${s.number}. ${s.name}</option>`).join('');
    onSura();
    status('جاهز. اختار السورة والآيات ثم اضغط معاينة أو تسجيل.');
  } catch (e) {
    status('تعذّر تحميل قائمة السور. تأكد من الاتصال ثم أعد فتح الصفحة.');
  }
}
const curSura = () => suras[+$('sura').value - 1];
function onSura() {
  const n = curSura().numberOfAyahs;
  $('from').max = $('to').max = n;
  $('from').value = 1; $('to').value = Math.min(3, n);
}
$('sura').addEventListener('change', onSura);
$('theme').addEventListener('change', () => $('vidLbl').style.display = $('theme').value === 'v' ? 'grid' : 'none');
$('vid').addEventListener('change', async e => {
  const f = e.target.files[0]; if (!f) return;
  status('جارٍ تجهيز الفيديو…');
  vids.forEach(v => { v.pause(); v.remove(); });
  const url = f.size < 150e6 ? URL.createObjectURL(new Blob([await f.arrayBuffer()], { type: f.type || 'video/mp4' })) : URL.createObjectURL(f);
  vids = [0, 1].map(() => {
    const v = document.createElement('video');
    Object.assign(v, { muted: true, loop: false, playsInline: true, preload: 'auto', src: url });
    v.setAttribute('playsinline', '');
    Object.assign(v.style, { position: 'fixed', left: '-9999px', top: '0', width: '4px', height: '4px', opacity: '.01', pointerEvents: 'none' });
    document.body.appendChild(v); v.load();
    v.addEventListener('loadeddata', () => { if (!running) v.currentTime = 0.01; });
    return v;
  });
  cur = 0; status('تم تجهيز الفيديو.');
});

const RECITERS = {
  banna: { name: 'محمود علي البنا — ترتيل', folder: 'mahmoud_ali_al_banna_32kbps' },
  basit_r: { name: 'عبد الباسط عبد الصمد — ترتيل', folder: 'Abdul_Basit_Murattal_192kbps' },
  basit_m: { name: 'عبد الباسط عبد الصمد — تجويد', folder: 'Abdul_Basit_Mujawwad_128kbps' },
  husary_r: { name: 'محمود خليل الحصري — ترتيل', folder: 'Husary_128kbps' },
  husary_m: { name: 'محمود خليل الحصري — تجويد', folder: 'Husary_Mujawwad_128kbps' },
  mustafa: { name: 'مصطفى إسماعيل', folder: 'Mustafa_Ismail_48kbps' },
  minshawi_r: { name: 'محمد صديق المنشاوي — ترتيل', folder: 'Minshawy_Murattal_128kbps' },
  minshawi_m: { name: 'محمد صديق المنشاوي — تجويد', folder: 'Minshawy_Mujawwad_192kbps' }
};
$('reciter').innerHTML = Object.entries(RECITERS).map(([k, v]) => `<option value="${k}">${v.name}</option>`).join('');
// ---------- الآيات والصوت ----------
async function loadAyahs(sn, from, to, rid) {
  const t = await getJSON(`${API}/surah/${sn}/quran-uthmani`);
  const pad = n => String(n).padStart(3, '0'), out = [];
  for (let i = from; i <= to; i++) {
    let txt = t.ayahs[i - 1].text;
    if (i === 1 && sn !== 1 && sn !== 9) {
      const w = txt.split(' ');
      if (w.length > 4 && strip(w[0]) === 'بسم') txt = w.slice(4).join(' ');
    }
    out.push({ n: i, text: txt, cands: [`https://everyayah.com/data/${RECITERS[rid].folder}/${pad(sn)}${pad(i)}.mp3`] });
  }
  return out;
}
function setupAudio() {
  if (actx) { if (actx.state === 'suspended') actx.resume(); return; }
  actx = new (window.AudioContext || window.webkitAudioContext)();
  audio = new Audio();
  plain = new Audio();
  const src = actx.createMediaElementSource(audio);
  dest = actx.createMediaStreamDestination();
  src.connect(dest); src.connect(actx.destination);
  // فتح تشغيل الصوت أثناء ضغطة المستخدم (مهم لسفاري)
  audio.src = 'data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQAAAAA=';
  audio.play().catch(() => {});
  plain.src = audio.src; plain.play().catch(() => {});
}
function tryOne(el, url) {
  return new Promise((res, rej) => {
    const clean = () => { clearTimeout(to); el.onended = el.onerror = el.onplaying = null; };
    const to = setTimeout(() => { clean(); rej(new Error('timeout')); }, 20000);
    el.onplaying = () => clearTimeout(to);
    el.onended = () => { clean(); res(); };
    el.onerror = () => { clean(); rej(new Error('load')); };
    el.src = url;
    el.play().catch(e => { clean(); rej(e); });
  });
}
let tierPref = 0;
async function fetchBlob(url) {
  const tiers = [u => u, u => 'https://corsproxy.io/?url=' + encodeURIComponent(u), u => 'https://api.allorigins.win/raw?url=' + encodeURIComponent(u), u => 'https://api.codetabs.com/v1/proxy?quest=' + encodeURIComponent(u)];
  const order = [tierPref, ...tiers.keys()].filter((v, i, a) => a.indexOf(v) === i);
  const errs = [];
  for (const k of order) {
    const ac = new AbortController(), to = setTimeout(() => ac.abort(), 15000);
    try {
      const r = await fetch(tiers[k](url), { signal: ac.signal });
      if (!r.ok) throw new Error('http ' + r.status);
      const b = await r.blob();
      if (b.size < 2000) throw new Error('empty');
      clearTimeout(to); tierPref = k;
      return URL.createObjectURL(new Blob([b], { type: 'audio/mpeg' }));
    } catch (e) { clearTimeout(to); errs.push('م' + k + ':' + e.message); }
  }
  throw new Error(errs.join(' '));
}
async function prepare(cands) {
  const errs = [];
  for (const u of cands) {
    try { return { blob: await fetchBlob(u), cands }; }
    catch (e) { errs.push(new URL(u).hostname + ' ' + e.message); }
  }
  return { cands, errs };
}
async function playPrepared(p) {
  if (p.blob) { await tryOne(audio, p.blob); return; }
  directUsed = true;
  let last;
  for (const u of p.cands) {
    if (cancelled) return;
    try { await tryOne(plain, u); return; }
    catch (e) { if (cancelled) return; last = e; }
  }
  throw new Error('audio: ' + (p.errs || []).slice(0, 3).join(' | ') + ' | direct ' + (last && last.message));
}

// ---------- الخلفيات الحية ----------
const rnd = (s => () => { s |= 0; s = s + 0x6D2B79F5 | 0; let t = Math.imul(s ^ s >>> 15, 1 | s); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; })(7);
const stars = Array.from({ length: 130 }, () => ({ x: rnd() * W, y: rnd() * H * .65, r: rnd() * 1.7 + .4, p: rnd() * 6.28, s: 1 + rnd() * 2 }));
const clouds = Array.from({ length: 6 }, () => ({ x: rnd() * W, y: 90 + rnd() * 420, w: 220 + rnd() * 260, s: 6 + rnd() * 14, a: .1 + rnd() * .12 }));
const motes = Array.from({ length: 28 }, () => ({ x: rnd() * W, y: rnd() * H, r: 1.5 + rnd() * 2, p: rnd() * 6.28, s: 8 + rnd() * 18 }));
function sky(stops, h) {
  const g = ctx.createLinearGradient(0, 0, 0, h);
  stops.forEach((c, i) => g.addColorStop(i / (stops.length - 1), c));
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, h);
}
function glow(x, y, r, col) {
  const g = ctx.createRadialGradient(x, y, 0, x, y, r);
  g.addColorStop(0, col); g.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, r, 0, 6.283); ctx.fill();
}
function cloud(c, t, col) {
  const x = ((c.x + t * c.s) % (W + c.w * 2)) - c.w;
  ctx.save(); ctx.translate(x, c.y); ctx.scale(1, .3);
  const g = ctx.createRadialGradient(0, 0, 0, 0, 0, c.w / 2);
  g.addColorStop(0, `rgba(${col},${c.a * 2})`); g.addColorStop(1, `rgba(${col},0)`);
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0, 0, c.w / 2, 0, 6.283); ctx.fill(); ctx.restore();
}
function ridge(base, amp, f, ph, col) {
  ctx.fillStyle = col; ctx.beginPath(); ctx.moveTo(0, H);
  for (let x = 0; x <= W; x += 10) ctx.lineTo(x, base + Math.sin(x * f + ph) * amp + Math.sin(x * f * 2.3 + ph * 1.7) * amp * .4);
  ctx.lineTo(W, H); ctx.fill();
}
const mist = (y, t, col) => [0, 1].forEach(i => cloud({ x: i * 360, y, w: 640, s: 12 + i * 6, a: .14 }, t, col));

const scenes = [
  function sea(t) {
    sky(['#1b1b4b', '#7b3f7a', '#f08a4b', '#ffd27a'], 660);
    glow(360, 640, 280, 'rgba(255,210,120,.85)');
    ctx.fillStyle = '#fff1c2'; ctx.beginPath(); ctx.arc(360, 640, 62, 0, 6.283); ctx.fill();
    clouds.forEach(c => cloud(c, t, '255,190,150'));
    const g = ctx.createLinearGradient(0, 660, 0, H);
    g.addColorStop(0, '#f0a060'); g.addColorStop(.35, '#7a4a7a'); g.addColorStop(1, '#101c38');
    ctx.fillStyle = g; ctx.fillRect(0, 660, W, H - 660);
    for (let i = 0; i < 46; i++) {
      const y = 668 + i * i * .29, a = 1 + i * .12;
      ctx.strokeStyle = `rgba(255,220,170,${.24 - i * .0045})`; ctx.lineWidth = 2; ctx.beginPath();
      for (let x = 0; x <= W; x += 12) ctx.lineTo(x, y + Math.sin(x * .02 + t * 1.2 + i) * a);
      ctx.stroke();
    }
    for (let i = 0; i < 50; i++) {
      const w = (30 + i * 3) * (.5 + .5 * Math.sin(t * 3 + i * 2));
      ctx.fillStyle = 'rgba(255,235,180,.5)'; ctx.fillRect(360 - w / 2, 672 + i * i * .23, w, 2);
    }
  },
  function night(t) {
    sky(['#050a1f', '#101e45', '#1d3466'], H);
    stars.forEach(s => { ctx.fillStyle = `rgba(255,255,255,${.4 + .6 * Math.sin(t * s.s + s.p) ** 2})`; ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, 6.283); ctx.fill(); });
    glow(540, 250, 160, 'rgba(220,230,255,.35)');
    ctx.fillStyle = '#f4f1e4'; ctx.beginPath(); ctx.arc(540, 250, 54, 0, 6.283); ctx.fill();
    clouds.forEach(c => cloud(c, t, '170,190,255'));
    const p = (t % 7) / 1.1;
    if (p < 1) { const x = 100 + p * 420, y = 120 + p * 220; ctx.strokeStyle = `rgba(255,255,255,${1 - p})`; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x - 70, y - 40); ctx.stroke(); }
    ridge(1000, 70, .006, 1, '#070d1c'); ridge(1090, 50, .009, 3, '#04070f');
  },
  function forest(t) {
    sky(['#1c4a35', '#0e2c20', '#07150f'], H);
    for (let k = 0; k < 4; k++) {
      ctx.fillStyle = `rgba(220,255,200,${.05 + .03 * Math.sin(t * .6 + k)})`;
      const x = 120 + k * 160; ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x + 90, 0); ctx.lineTo(x - 70, H * .8); ctx.lineTo(x - 160, H * .8); ctx.fill();
    }
    ['#12362a', '#0b261c', '#06150f'].forEach((col, L) => {
      const base = 900 + L * 110; ctx.fillStyle = col;
      for (let x = -20; x < W + 40; x += 46 - L * 8) {
        const h = 230 + ((x * 7 + L * 13) % 90) + L * 20, sw = Math.sin(t * .6 + x * .05 + L) * (3 + L * 2);
        ctx.beginPath(); ctx.moveTo(x + sw, base - h); ctx.lineTo(x - h * .2, base); ctx.lineTo(x + h * .2, base); ctx.fill();
      }
      ctx.fillRect(0, base, W, H - base);
      if (L < 2) mist(base - 60, t + L * 9, '200,230,210');
    });
    motes.forEach(m => {
      const x = m.x + Math.sin(t * .4 + m.p) * 30, y = ((m.y - t * m.s) % H + H) % H;
      glow(x, y, m.r * 7, `rgba(230,255,140,${.25 + .5 * Math.sin(t * 2 + m.p) ** 2})`);
    });
  },
  function mountains(t) {
    sky(['#2b3a67', '#b98aa0', '#f0b890', '#ffe7b8'], H);
    glow(360, 820, 240, 'rgba(255,235,190,.8)');
    ctx.fillStyle = '#fff6dc'; ctx.beginPath(); ctx.arc(360, 820, 46, 0, 6.283); ctx.fill();
    ridge(780, 90, .007, .5, '#8a7aa6'); mist(800, t, '255,232,224');
    ridge(890, 100, .006, 2, '#5c5a8a'); mist(930, t + 20, '255,232,224');
    ridge(1000, 110, .008, 4, '#35365f'); ridge(1110, 90, .01, 1, '#1b1c38');
    ctx.strokeStyle = '#2a2440'; ctx.lineWidth = 2;
    for (let i = 0; i < 4; i++) {
      const bx = ((t * 40 + i * 220) % (W + 200)) - 100, by = 300 + i * 60 + Math.sin(t + i) * 14, f = Math.sin(t * 8 + i) * 8;
      ctx.beginPath(); ctx.moveTo(bx - 16, by + f * .5); ctx.quadraticCurveTo(bx - 6, by - 8 - f, bx, by); ctx.quadraticCurveTo(bx + 6, by - 8 - f, bx + 16, by + f * .5); ctx.stroke();
    }
  }
];
const fc = document.createElement('canvas'); fc.width = W; fc.height = H;
const fx = fc.getContext('2d');
let vids = [], cur = 0, lp = { ct: -1, at: 0, n: 0 };
const play = v => v.play().catch(() => {});
function bgStart() {
  if (!vids.length) return;
  cur = 0; const [a, b] = vids;
  b.pause(); b.currentTime = 0; a.currentTime = 0; play(a);
  lp = { ct: -1, at: performance.now(), n: 0 };
}
function bgStop() { vids.forEach(v => { v.pause(); v.currentTime = 0.01; }); cur = 0; }
function swap() {
  const a = vids[cur], b = vids[1 - cur];
  play(b); a.pause(); cur = 1 - cur;
  setTimeout(() => { a.currentTime = 0; }, 80);
  lp = { ct: -1, at: performance.now(), n: 0 };
}
function bgTick() {
  const a = vids[cur], b = vids[1 - cur], d = a.duration, now = performance.now();
  if (!d) return;
  if (a.ended || a.currentTime >= d - 0.2) {
    if (b.readyState >= 2) swap(); else if (a.ended) { a.currentTime = 0; play(a); }
    return;
  }
  if (a.paused) play(a);
  if (a.currentTime !== lp.ct) { lp.ct = a.currentTime; lp.at = now; lp.n = 0; }
  else if (now - lp.at > 1500) {
    lp.at = now; lp.n++;
    if (lp.n >= 2 && b.readyState >= 2) swap();
    else { a.currentTime = Math.min(a.currentTime + 0.1, d - 0.3); play(a); }
  }
}
function drawBG(t) {
  const v = $('theme').value;
  if (v === 'v' && vids.length) {
    if (running) bgTick();
    const a = vids[cur];
    if (a.readyState >= 2 && a.videoWidth) {
      const k = Math.max(W / a.videoWidth, H / a.videoHeight), w = a.videoWidth * k, h = a.videoHeight * k;
      fx.drawImage(a, (W - w) / 2, (H - h) / 2, w, h);
    }
    ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H); ctx.drawImage(fc, 0, 0);
  } else scenes[+v || 0](t);
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, 'rgba(0,0,0,.35)'); g.addColorStop(.5, 'rgba(0,0,0,.3)'); g.addColorStop(1, 'rgba(0,0,0,.5)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
}

// ---------- رسم النص ----------
function wrap(text, size, maxW) {
  ctx.font = `${size}px "Amiri Quran", serif`;
  const lines = []; let cur = '';
  for (const w of text.split(' ')) {
    const t = cur ? cur + ' ' + w : w;
    if (ctx.measureText(t).width > maxW && cur) { lines.push(cur); cur = w; } else cur = t;
  }
  if (cur) lines.push(cur);
  return lines;
}
function layout(text) {
  let size = 68, lines;
  for (; size >= 22; size -= 2) { lines = wrap(text, size, W - 120); if (lines.length * size * 1.9 <= H - 560) break; }
  return { size, lines };
}
function draw(t) {
  drawBG(t);
  ctx.strokeStyle = 'rgba(217,182,106,.6)'; ctx.lineWidth = 3; ctx.strokeRect(30, 30, W - 60, H - 60);
  ctx.direction = 'rtl'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  if (!state) return;
  ctx.shadowColor = 'rgba(0,0,0,.75)'; ctx.shadowBlur = 12;
  ctx.fillStyle = '#d9b66a'; ctx.font = '48px "Amiri Quran", serif';
  ctx.fillText(state.suraName, W / 2, 150);
  const { size, lines } = state.lay, lh = size * 1.9;
  let y = H / 2 - ((lines.length - 1) * lh) / 2;
  ctx.fillStyle = '#fff'; ctx.font = `${size}px "Amiri Quran", serif`;
  for (const l of lines) { ctx.fillText(l, W / 2, y); y += lh; }
  ctx.fillStyle = '#d9b66a'; ctx.font = '40px "Amiri Quran", serif';
  ctx.fillText('﴿' + state.num + '﴾', W / 2, H - 200);
  ctx.fillStyle = '#d5e0dd'; ctx.font = '26px "Readex Pro", sans-serif';
  ctx.fillText(state.reciterName, W / 2, H - 130);
  ctx.fillStyle = 'rgba(255,255,255,.55)'; ctx.font = '22px "Readex Pro", sans-serif';
  ctx.fillText('Omar Mahmoud', W / 2, H - 80);
  ctx.shadowBlur = 0;
}
(function loop(ts) { draw(ts / 1000); requestAnimationFrame(loop); })(0);

// ---------- التشغيل / التسجيل ----------
async function run(record) {
  if (running) return;
  const s = curSura(), from = +$('from').value, to = +$('to').value;
  if (!(from >= 1 && to <= s.numberOfAyahs && from <= to)) {
    status('تأكد من نطاق الآيات: من ≥ 1 وإلى ≤ ' + s.numberOfAyahs + ' و«من» ≤ «إلى».'); return;
  }
  running = true; cancelled = false;
  $('prev').disabled = $('rec').disabled = true; $('stop').style.display = 'block'; $('dl').style.display = 'none';
  if (objUrl) { URL.revokeObjectURL(objUrl); objUrl = null; }
  let rec = null, chunks = [], mime = '';
  const reciterName = $('reciter').selectedOptions[0].textContent;
  try {
    setupAudio();
    await document.fonts.load('40px "Amiri Quran"'); await document.fonts.load('26px "Readex Pro"');
    status('جارٍ تحميل الآيات…');
    const ayahs = await loadAyahs(s.number, from, to, $('reciter').value);
    directUsed = false;
    for (let i = 0; i < ayahs.length; i++) {
      if (cancelled) throw new Error('cancel');
      status(`تحميل الصوت… (${i + 1} من ${ayahs.length})`);
      ayahs[i].p = await prepare(ayahs[i].cands);
    }
    if (record) {
      mime = ['video/mp4;codecs=avc1,mp4a.40.2', 'video/mp4', 'video/webm;codecs=vp9,opus', 'video/webm']
        .find(t => window.MediaRecorder && MediaRecorder.isTypeSupported(t));
      if (!mime) throw new Error('nomr');
      const stream = cv.captureStream(30);
      dest.stream.getAudioTracks().forEach(t => stream.addTrack(t));
      rec = new MediaRecorder(stream, { mimeType: mime, videoBitsPerSecond: 5000000 });
      rec.ondataavailable = e => { if (e.data.size) chunks.push(e.data); };
      rec.start(500);
    }
    if ($('theme').value === 'v') bgStart();
    state = { suraName: s.name, num: ayahs[0].n, lay: layout(ayahs[0].text), reciterName };
    await sleep(700);
    for (let i = 0; i < ayahs.length && !cancelled; i++) {
      const a = ayahs[i];
      state = { suraName: s.name, num: a.n, lay: layout(a.text), reciterName };
      status(`${record ? 'يتم التسجيل' : 'معاينة'}: الآية ${a.n} (${i + 1} من ${ayahs.length})`);
      await playPrepared(a.p);
      await sleep(350);
    }
    await sleep(500);
    if (rec) {
      const done = new Promise(r => rec.onstop = r); rec.stop(); await done;
      if (!cancelled) {
        objUrl = URL.createObjectURL(new Blob(chunks, { type: mime.split(';')[0] }));
        const dl = $('dl'); dl.href = objUrl;
        dl.download = `quran-${s.number}-${from}-${to}.${mime.startsWith('video/mp4') ? 'mp4' : 'webm'}`;
        dl.style.display = 'block';
        status('تم إنشاء الفيديو. اضغط «تحميل الفيديو».');
      }
    }
    if (cancelled) status('تم الإيقاف.');
    else if (record && directUsed) status('تنبيه: تعذّر تحميل الصوت للتسجيل (المصدر بيمنع الوصول)، فالفيديو اتسجّل بدون صوت. جرّب تاني أو افتح الملف من Chrome على الكمبيوتر.');
    else if (!record) status('انتهت المعاينة.');
  } catch (e) {
    console.error(e);
    if (rec && rec.state !== 'inactive') rec.stop();
    const m = e.message || '';
    if (cancelled) status('تم الإيقاف.');
    else if (m === 'nomr') status('هذا المتصفح لا يدعم تسجيل الفيديو. جرّب Chrome أو Safari حديث.');
    else if (m.startsWith('audio')) status(`تعذّر تحميل صوت «${reciterName}». التفاصيل: ${m.replace('audio: ', '')}`);
    else status('خطأ: ' + m);
  } finally {
    running = false; bgStop();
    $('prev').disabled = $('rec').disabled = false; $('stop').style.display = 'none';
  }
}
$('prev').addEventListener('click', () => run(false));
$('rec').addEventListener('click', () => run(true));
$('stop').addEventListener('click', () => { cancelled = true; [audio, plain].forEach(el => { if (el) { el.pause(); el.onended && el.onended(); } }); });
init();
</script>
